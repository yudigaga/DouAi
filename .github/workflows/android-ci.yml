name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test local verification tools
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Assemble unsigned minified Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Run unit tests and Release APK contracts
        id: unit_tests
        env:
          DOUAI_VERIFY_RELEASE_APK: ${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned.apk
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Report all host contracts
        if: always() && steps.unit_tests.outcome != 'skipped'
        shell: bash
        run: |
          python3 -B tools/release_verification.py host-summary --summary app/build/reports/host-contracts.md

      - name: Run Release Lint
        if: ${{ !cancelled() }}
        id: release_lint
        run: ./gradlew :app:lintRelease --console=plain

      - name: Check reviewed Lint warning budget
        if: always() && steps.release_lint.outcome != 'skipped'
        run: python3 -B tools/lint_budget.py check --report app/build/reports/lint-results-release.xml --output app/build/reports/lint-budget.json

      - name: Preserve verification reports and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/reports/lint-budget.*
            app/build/reports/host-contracts.md
            app/build/outputs/mapping/release/
